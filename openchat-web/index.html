<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenChat</title>
<style>
*{box-sizing:border-box}html,body{height:100%}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#0f0f0f;color:#eee;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1c1c1c;border-bottom:1px solid #333;position:sticky;top:0;z-index:2}
header b{font-size:16px;white-space:nowrap}
header select{flex:1;max-width:220px;margin-left:auto;padding:9px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:15px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.msg{padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45}
.me{align-self:flex-end;background:#0b5fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#222;border-bottom-left-radius:4px}
.sys{align-self:center;background:#3a2b00;font-size:13px}
.typing{opacity:.6;font-style:italic}
#bar{display:flex;gap:8px;padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));border-top:1px solid #333;background:#1c1c1c;position:sticky;bottom:0}
#q{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#eee;font-size:16px}
#send{padding:12px 18px;border-radius:10px;border:0;background:#0b5fff;color:#fff;font-weight:700;font-size:16px;cursor:pointer;min-width:72px}
#send:disabled{opacity:.5}
#attach{padding:12px;border-radius:10px;border:1px solid #444;background:#1c1c1c;font-size:18px;cursor:pointer}
#attach.on{border-color:#0b5fff;background:#0b3a8f}
.msg img{max-width:100%;border-radius:8px;margin-bottom:6px}
#newchat{margin-left:2px;padding:9px 12px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:16px;cursor:pointer}
#docs,#arena{padding:9px 12px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2}
#arena{background:#2a1030;border-color:#7c3aed}
#docwrap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10;padding:12px}
#docbox{background:#161616;border:1px solid #444;border-radius:12px;max-width:800px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
#dochead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #333}
#dochead b{flex:1}#dochead button{padding:8px 14px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:14px}
#docbody{overflow-y:auto;padding:14px;font-size:14px;line-height:1.55;-webkit-overflow-scrolling:touch}
#docbody h1{font-size:19px}#docbody h2{font-size:17px;color:#8ab4ff;margin-top:18px}#docbody h3{font-size:15px;color:#8ab4ff}
#docbody code{background:#000;padding:1px 5px;border-radius:4px;font-size:12.5px;word-break:break-all}
#docbody pre{background:#000;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}
#docbody table{border-collapse:collapse;width:100%;font-size:12.5px}#docbody th,#docbody td{border:1px solid #444;padding:5px 7px;text-align:left}
@media(min-width:700px){.msg{max-width:70%}#log{padding:16px 24px}}
</style>
</head>
<body>
<header><b>OpenChat</b><button id="newchat" aria-label="New chat">＋</button><a id="arena" href="arena/" title="Possessed Butler arena" aria-label="Possessed Butler arena">🎃</a><button id="docs" aria-label="Documentation">？</button><select id="model" aria-label="Model">
<option value="auto">Auto</option><option value="deepseek">DeepSeek R1</option><option value="gpt4o">GPT-4o</option><option value="gpt5">GPT-5</option>
<option value="claude45">Claude 4.5</option><option value="gemini3">Gemini 3</option><option value="grok41">Grok 4.1</option>
</select></header>
<div id="log"></div>
<div id="bar"><input type="file" id="file" accept="image/*" hidden><button id="attach" aria-label="Attach image">📎</button><input id="q" placeholder="Ask anything…" autocomplete="off" enterkeyhint="send"><button id="send">Send</button></div>
<div id="docwrap"><div id="docbox"><div id="dochead"><b>Documentation</b><button id="docclose">Close</button></div><div id="docbody">loading…</div></div></div>
<script src="app.js"></script>
</body>
</html>
